<script>

const URL_API = "https://opensheet.elk.sh/1FKppkcwfb66pQ_2Fgw2DAJIDREmUcyL5hqUG0CsY9UE/RECEPCION";

async function cargarDatos(){

    const response = await fetch(URL_API);
    const datos = await response.json();

    document.getElementById("total").innerText = datos.length;

    if(datos.length > 0){

        const ultimo = datos[datos.length - 1];

        document.getElementById("placa").innerText =
            ultimo.PLACA || "-";
    }

    let html = "";

    datos.forEach(fila => {

        html += `
        <tr>
            <td>${fila.PLACA || ""}</td>
            <td>${fila.CLIENTE || ""}</td>
            <td>${fila["TIEMPO DE ATENCIÓN DEL CAMIÓN"] || ""}</td>
        </tr>
        `;

    });

    document.getElementById("tabla").innerHTML = html;

}

cargarDatos();

setInterval(cargarDatos,30000);

</script>
