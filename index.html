<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CONTROL TOWER - RECEPCIÓN</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:'Segoe UI',sans-serif;
    padding:20px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.titulo{
    font-size:32px;
    font-weight:bold;
}

#reloj{
    font-size:22px;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.card{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    box-shadow:0 0 15px rgba(0,0,0,.3);
}

.card h3{
    color:#94a3b8;
    margin-bottom:10px;
}

.valor{
    font-size:40px;
    font-weight:bold;
}

.azul{color:#38bdf8;}
.verde{color:#4ade80;}
.amarillo{color:#facc15;}
.rojo{color:#f87171;}

.graficos{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-bottom:20px;
}

canvas{
    background:#1e293b;
    padding:15px;
    border-radius:15px;
}

.tabla-container{
    background:#1e293b;
    border-radius:15px;
    padding:20px;
    overflow:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#334155;
    padding:12px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #334155;
}

tr:hover{
    background:#273449;
}

@media(max-width:900px){
    .graficos{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<div class="header">
    <div class="titulo">🚚 CONTROL TOWER RECEPCIÓN</div>
    <div id="reloj"></div>
</div>

<div class="kpis">

    <div class="card">
        <h3>Total Recepciones</h3>
        <div id="total" class="valor azul">0</div>
    </div>

    <div class="card">
        <h3>Recepciones Hoy</h3>
        <div id="hoy" class="valor verde">0</div>
    </div>

    <div class="card">
        <h3>Clientes Únicos</h3>
        <div id="clientes" class="valor amarillo">0</div>
    </div>

    <div class="card">
        <h3>Última Placa</h3>
        <div id="placa" class="valor rojo">-</div>
    </div>

</div>

<div class="graficos">

    <canvas id="graficoHoras"></canvas>

    <canvas id="graficoClientes"></canvas>

</div>

<div class="tabla-container">

<h2>Últimas Recepciones</h2>

<br>

<table>

<thead>
<tr>
<th>Fecha</th>
<th>Placa</th>
<th>Cliente</th>
<th>Hora Arribo</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

</div>

<script>

const URL =
"https://opensheet.elk.sh/1FKppkcwfb66pQ_2Fgw2DAJIDREmUcyL5hqUG0CsY9UE/RECEPCION";

let chartHoras;
let chartClientes;

function actualizarReloj(){

    const ahora = new Date();

    document.getElementById("reloj").innerHTML =
    ahora.toLocaleString("es-PE");

}

setInterval(actualizarReloj,1000);
actualizarReloj();

async function cargarDatos(){

    const response = await fetch(URL);
    const datos = await response.json();

    document.getElementById("total").innerText =
    datos.length;

    if(datos.length>0){

        document.getElementById("placa").innerText =
        datos[datos.length-1].PLACA || "-";

    }

    const clientesUnicos =
    [...new Set(datos.map(x => x.CLIENTE))];

    document.getElementById("clientes").innerText =
    clientesUnicos.length;

    const hoy = new Date().toLocaleDateString("es-PE");

    const recepcionesHoy =
    datos.filter(x => x.FECHA?.includes(hoy));

    document.getElementById("hoy").innerText =
    recepcionesHoy.length;

    let html="";

    [...datos].reverse().slice(0,50).forEach(fila=>{

        html += `
        <tr>
            <td>${fila.FECHA || ""}</td>
            <td>${fila.PLACA || ""}</td>
            <td>${fila.CLIENTE || ""}</td>
            <td>${fila.H_ARRIBO || ""}</td>
        </tr>
        `;

    });

    document.getElementById("tabla").innerHTML = html;

    generarGraficoHoras(datos);
    generarGraficoClientes(datos);

}

function generarGraficoHoras(datos){

    const horas={};

    datos.forEach(x=>{

        if(x.H_ARRIBO){

            const h=x.H_ARRIBO.split(":")[0];

            horas[h]=(horas[h]||0)+1;
        }

    });

    if(chartHoras) chartHoras.destroy();

    chartHoras=new Chart(
        document.getElementById('graficoHoras'),
        {
            type:'bar',
            data:{
                labels:Object.keys(horas),
                datasets:[{
                    label:'Recepciones por Hora',
                    data:Object.values(horas)
                }]
            }
        }
    );

}

function generarGraficoClientes(datos){

    const clientes={};

    datos.forEach(x=>{

        clientes[x.CLIENTE] =
        (clientes[x.CLIENTE] || 0)+1;

    });

    const top =
    Object.entries(clientes)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10);

    if(chartClientes) chartClientes.destroy();

    chartClientes=new Chart(
        document.getElementById('graficoClientes'),
        {
            type:'doughnut',
            data:{
                labels:top.map(x=>x[0]),
                datasets:[{
                    data:top.map(x=>x[1])
                }]
            }
        }
    );

}

cargarDatos();

setInterval(cargarDatos,30000);

</script>

</body>
</html>
