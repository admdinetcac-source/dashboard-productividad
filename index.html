<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Tower Logística</title>

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Outfit',sans-serif;
}

body{
    background:#f4f7fb;
    padding:20px;
}

.header{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 15px rgba(0,0,0,.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.header h1{
    color:#1e40af;
}

.clock{
    font-size:24px;
    font-weight:700;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
    margin-bottom:20px;
}

.kpi{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.kpi h3{
    font-size:14px;
    color:#64748b;
}

.kpi .value{
    font-size:36px;
    font-weight:700;
    color:#2563eb;
}

.content{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.card{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#eff6ff;
    padding:12px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid #e5e7eb;
}

.badge{
    padding:6px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:600;
}

.ok{
    background:#dcfce7;
    color:#15803d;
}

.proc{
    background:#dbeafe;
    color:#1d4ed8;
}

.pend{
    background:#fee2e2;
    color:#dc2626;
}

.chart{
    height:350px;
}

@media(max-width:1200px){
    .content{
        grid-template-columns:1fr;
    }

    .kpis{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<div class="header">
    <div>
        <h1>🚚 Control Tower Logística</h1>
        <p>Recepciones y Despachos en Tiempo Real</p>
    </div>

    <div class="clock" id="clock"></div>
</div>

<div class="kpis">

    <div class="kpi">
        <h3>Recepciones Programadas</h3>
        <div class="value" id="recepProg">0</div>
    </div>

    <div class="kpi">
        <h3>En Proceso</h3>
        <div class="value" id="recepProceso">0</div>
    </div>

    <div class="kpi">
        <h3>Completadas</h3>
        <div class="value" id="recepComp">0</div>
    </div>

    <div class="kpi">
        <h3>Pendientes</h3>
        <div class="value" id="recepPend">0</div>
    </div>

</div>

<div class="content">

    <div class="card">

        <h2 style="margin-bottom:15px;">
            Recepciones del Día
        </h2>

        <table>

            <thead>
                <tr>
                    <th>Cliente</th>
                    <th>Placa</th>
                    <th>Hora Arribo</th>
                    <th>Estado</th>
                </tr>
            </thead>

            <tbody id="tablaRecepciones">

            </tbody>

        </table>

    </div>

    <div class="card">

        <h2 style="margin-bottom:15px;">
            Recepciones por Hora
        </h2>

        <div class="chart">
            <canvas id="chartHoras"></canvas>
        </div>

    </div>

</div>

<script>

function actualizarReloj(){

    document.getElementById('clock').innerHTML =
        new Date().toLocaleTimeString('es-PE');

}

setInterval(actualizarReloj,1000);
actualizarReloj();

const URL_SHEET =
'https://opensheet.elk.sh/1FKppkcwfb66pQ_2Fgw2DAJIDREmUcyL5hqUG0CsY9UE/RECEPCION';

let chartHoras;

async function cargarDatos(){

    try{

        const response = await fetch(URL_SHEET);

        const datos = await response.json();

        document.getElementById('recepProg').innerHTML =
            datos.length;

        let proceso = 0;
        let completo = 0;
        let pendiente = 0;

        const tabla =
            document.getElementById('tablaRecepciones');

        tabla.innerHTML = '';

        const horas = {};

        datos.forEach(item=>{

            const estado =
                (item.STATUS || '').toLowerCase();

            if(estado.includes('proceso')) proceso++;
            else if(estado.includes('complet')) completo++;
            else pendiente++;

            const fila = `
            <tr>
                <td>${item.CLIENTE || '-'}</td>
                <td>${item.PLACA || '-'}</td>
                <td>${item.H_ARRIBO || '-'}</td>
                <td>
                    <span class="badge ${
                        estado.includes('complet')
                        ? 'ok'
                        : estado.includes('proceso')
                        ? 'proc'
                        : 'pend'
                    }">
                        ${item.STATUS || 'Pendiente'}
                    </span>
                </td>
            </tr>
            `;

            tabla.innerHTML += fila;

            if(item.H_ARRIBO){

                let h =
                item.H_ARRIBO.split(':')[0] + ':00';

                horas[h] = (horas[h] || 0) + 1;

            }

        });

        document.getElementById('recepProceso').innerHTML =
            proceso;

        document.getElementById('recepComp').innerHTML =
            completo;

        document.getElementById('recepPend').innerHTML =
            pendiente;

        graficarHoras(horas);

    }
    catch(error){

        console.error(error);

    }

}

function graficarHoras(datos){

    const labels =
        Object.keys(datos);

    const values =
        Object.values(datos);

    if(chartHoras)
        chartHoras.destroy();

    chartHoras = new Chart(

        document.getElementById('chartHoras'),

        {
            type:'bar',

            data:{
                labels:labels,

                datasets:[{
                    label:'Recepciones',
                    data:values
                }]
            },

            options:{
                responsive:true,
                maintainAspectRatio:false
            }
        }

    );

}

cargarDatos();

setInterval(cargarDatos,30000);

</script>

</body>
</html>
