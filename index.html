<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Dashboard Recepción MCI</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:20px;
}

h1{
    text-align:center;
    color:#1f2937;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
    margin-top:30px;
}

.card{
    border-radius:15px;
    padding:20px;
    color:white;
    text-align:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.card h2{
    font-size:18px;
    margin-bottom:10px;
}

.card p{
    font-size:40px;
    font-weight:bold;
    margin:0;
}

.atendidos{
    background:#2563eb;
}

.promedio{
    background:#f59e0b;
}

.proceso{
    background:#dc2626;
}

.finalizados{
    background:#16a34a;
}

.tabla{
    margin-top:40px;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#2563eb;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<h1>🚚 Dashboard Recepción de Camiones</h1>

<div class="dashboard">

<div class="card atendidos">
<h2>Camiones Atendidos</h2>
<p id="atendidos">0</p>
</div>

<div class="card promedio">
<h2>Tiempo Promedio</h2>
<p id="promedio">0</p>
</div>

<div class="card proceso">
<h2>En Proceso</h2>
<p id="proceso">0</p>
</div>

<div class="card finalizados">
<h2>Finalizados</h2>
<p id="finalizados">0</p>
</div>

</div>

<div class="tabla">

<h2>Últimos Registros</h2>

<table>

<thead>
<tr>
<th>Placa</th>
<th>Cliente</th>
<th>Hora Inicio</th>
<th>Hora Fin</th>
<th>Estado</th>
</tr>
</thead>

<tbody id="tablaBody">
</tbody>

</table>

</div>

<script>

const URL_API = "https://script.google.com/macros/s/AKfycbyxCXys8vUowqW69RWGi9Dbv6CzB8O-_Zu4-xvQefI4RvNOPSn_Lory2Tbq-rB9bu4A/exec";

async function cargarDatos(){

    const response = await fetch(URL_API);
    const data = await response.json();

    if(data.length <= 1){
        return;
    }

    const registros = data.slice(1);

    let atendidos = registros.length;
    let finalizados = 0;
    let proceso = 0;

    document.getElementById("atendidos").innerText = atendidos;

    let tabla = "";

    registros.reverse().forEach(r => {

        const placa = r[2] || "";
        const cliente = r[3] || "";
        const inicio = r[4] || "";
        const fin = r[9] || "";

        let estado = "En Proceso";

        if(fin !== ""){
            estado = "Finalizado";
            finalizados++;
        }else{
            proceso++;
        }

        tabla += `
        <tr>
            <td>${placa}</td>
            <td>${cliente}</td>
            <td>${inicio}</td>
            <td>${fin}</td>
            <td>${estado}</td>
        </tr>
        `;
    });

    document.getElementById("finalizados").innerText = finalizados;
    document.getElementById("proceso").innerText = proceso;

    document.getElementById("tablaBody").innerHTML = tabla;

    document.getElementById("promedio").innerText = "25 min";

}

cargarDatos();

setInterval(cargarDatos,60000);

</script>

</body>

</html>
