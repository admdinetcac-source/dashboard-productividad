<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Prueba OpenSheet</title>
</head>
<body>

<h1>Prueba de conexión</h1>

<pre id="resultado">Cargando...</pre>

<script>

fetch("https://opensheet.elk.sh/1FKppkcwfb66pQ_2Fgw2DAJIDREmUcyL5hqUG0CsY9UE/RECEPCION")
.then(r => r.json())
.then(data => {
    document.getElementById("resultado").textContent =
    JSON.stringify(data.slice(0,3), null, 2);
})
.catch(error => {
    document.getElementById("resultado").textContent =
    "ERROR: " + error;
});

</script>

</body>
</html>
